name: build

on:
  schedule:
    # Every 6 hours. Upstream cuts releases irregularly, so this is a poll.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Install base tooling
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git curl bsdtar sudo

      - uses: actions/checkout@v4

      - name: Prepare build user
        run: |
          # makepkg refuses to run as root, so use an unprivileged user.
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build package
        run: |
          su builder -c "cd $GITHUB_WORKSPACE && ./build.sh"

      - name: Commit repository
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          chown -R root:root "$GITHUB_WORKSPACE"
          git add -A docs
          if git diff --cached --quiet; then
            echo "Repository unchanged."
            exit 0
          fi
          git commit -m "repo: update slssteam-bin"
          git push
