name: build

on:
  schedule:
    # Upstream cuts a release every few months, so a daily poll is plenty.
    # GitHub skips scheduled runs when Activity is idle for 60 days unless the
    # repo has recent commits; the bot's own commits keep it alive.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Install base tooling
        run: |
          # A fresh archlinux container has no populated pacman keyring, so
          # keyring initialisation has to happen before any package is pulled.
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed \
            base-devel git curl libarchive sudo

      - uses: actions/checkout@v4

      - name: Prepare build user
        run: |
          # makepkg refuses to run as root, so use an unprivileged user.
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build package
        run: |
          su builder -c "cd $GITHUB_WORKSPACE && ./build.sh"

      - name: Commit repository
        run: |
          # The workspace was handed to 'builder' during the build, so root
          # needs to be told the repository is safe before git will touch it.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          chown -R root:root "$GITHUB_WORKSPACE"
          git add -A docs
          if git diff --cached --quiet; then
            echo "Repository unchanged."
            exit 0
          fi
          git commit -m "repo: update slssteam-bin"
          git push
